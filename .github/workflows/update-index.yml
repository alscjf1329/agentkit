name: update-trend-index

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python crawler/crawl.py
          mkdir -p plugins/stack-setup/data
          cp index/index.json plugins/stack-setup/data/index.json
      - name: Commit
        run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add index/index.json plugins/stack-setup/data/index.json
          git diff --cached --quiet || git commit -m "chore: update trend index $(date -u +%F)"
          git push
